<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ڤوكالنا Vocalna — غنّي مظبوط على مقامك</title>
<meta name="description" content="ڤوكالنا: درّب صوتك بنفسك، لحّن، واتعلّم مزيكا شرقي. مدرّب بيسمعك وبيسمع ربع التون عشان تغنّي شرقي صح.">
<meta property="og:title" content="ڤوكالنا Vocalna — غنّي مظبوط على مقامك">
<meta property="og:description" content="درّب صوتك بنفسك · لحّن · اتعلّم مزيكا شرقي. أندرويد وآيفون · أول 2027.">
<meta property="og:url" content="https://vocalna.com/">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--bg:#08080a;--panel:#121216;--line:#26262d;--fg:#f1eee7;--muted:#9c98a3;--gold:#d6b25a;--gold2:#f0d58c;--ink:#14110a;
  --display:"Aref Ruqaa",serif;--body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.75 var(--body)}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1040px;margin:0 auto}
nav.band{padding-block:18px}
nav .in{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none}
.brand svg{width:40px;height:40px;color:var(--gold)}
.brand b{font:700 1.9rem var(--display)}
.brand b i{font-style:normal;color:var(--gold)}
.lang{font:500 .9rem var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.lang:focus-visible,.cta:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header.band{padding-block:40px 64px}
header .in{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
h1{font:700 clamp(2.6rem,7vw,4.6rem)/1.15 var(--display);margin:0 0 6px;text-wrap:balance}
h1 i{font-style:normal;color:var(--gold)}
.tag{font-size:1.15rem;color:var(--gold2);margin:0 0 18px}
.lead{color:var(--muted);max-width:52ch;margin:0 0 28px}
.cta{display:inline-block;background:var(--gold);color:var(--ink);font:600 1.05rem var(--body);border:0;border-radius:14px;padding:13px 30px;text-decoration:none;cursor:pointer}
.note{font-size:.88rem;color:var(--muted);margin-top:10px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;min-width:0}
.stage small{color:var(--muted);font-size:.85rem}
#wave{width:100%;height:190px;display:block}
.read{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted)}
.read b{color:var(--fg);font-weight:600}
section.band{padding-block:56px}
h2{font:700 clamp(1.8rem,4vw,2.4rem)/1.3 var(--display);margin:0 0 8px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 30px;max-width:60ch}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.door{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}
.door b{display:block;font:700 1.45rem var(--display);color:var(--gold);margin-bottom:6px}
.door p{margin:0;color:var(--muted);font-size:.98rem}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 40px}
.feat>div{min-width:0}
.feat b{display:block;font-weight:600;font-size:1.08rem;margin-bottom:4px}
.feat p{margin:0;color:var(--muted)}
.feat .q{font-family:var(--display);color:var(--gold);font-size:1.6rem;display:block;line-height:1.2}
.feat .star{grid-column:1/-1;order:-1;border:1px solid var(--gold);border-radius:20px;padding:24px;background:linear-gradient(135deg,rgba(214,178,90,.12),transparent 60%),var(--panel)}
.feat .star .q{font-size:2.2rem}.feat .star b{font-size:1.25rem}
.badge{display:inline-block;background:var(--gold);color:var(--ink);font-size:.78rem;font-weight:600;border-radius:999px;padding:1px 12px;margin-bottom:6px}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0 8px}
.meters span{display:block;min-width:0}.meters i{display:block;height:8px;border-radius:4px;background:var(--gold);margin-bottom:6px}
.meters em{font-style:normal;font-size:.85rem;color:var(--muted)}
.med{color:var(--muted);font-size:.82rem}
.scale{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;direction:ltr}
.scale span{border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:.85rem}
.scale span.qt{border-color:var(--gold);color:var(--gold)}
form{display:flex;gap:10px;flex-wrap:wrap;max-width:560px}
input{flex:1 1 240px;min-width:0;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
#ok{color:var(--gold2);margin-top:12px;min-height:1.6em}
footer.band{padding-block:30px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
footer a{color:inherit}
@media (max-width:820px){header .in,.feat,.doors{grid-template-columns:1fr}header.band{padding-block:20px 40px}}
@media (prefers-reduced-motion:reduce){#wave{display:none}}
#df,#tg{direction:ltr;unicode-bidi:isolate}
@media (min-width:1200px){.in{max-width:1280px}h1{font-size:5.6rem}.lead{font-size:1.15rem}header.band{padding-block:56px 24px}section.band{padding-block:48px}.stage{padding:30px}}
</style>
</head>
<body>
<nav class="band"><div class="in">
  <a class="brand" href="#" aria-label="Vocalna">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="1" y="1" width="62" height="62" rx="16" fill="var(--panel)"/><path d="M16 27 V34 M24 27 V42 M32 27 V50 M40 27 V42 M48 27 V34" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="15" r="5" fill="currentColor"/></svg>
    <b id="wm"></b>
  </a>
  <button class="lang" id="lang" type="button">English</button>
</div></nav>

<header class="band"><div class="in">
  <div>
    <h1 data-ar="غنّي مظبوط،<br>على <i>مقامك</i>." data-en="Sing in tune,<br>in <i>your maqam</i>."></h1>
    <p class="tag" data-ar="درّب صوتك بنفسك · لحّن · اتعلّم مزيكا شرقي" data-en="Train your voice yourself · Compose · Learn Arabic music"></p>
    <p class="lead" data-ar="مدرّب بيسمعك وانت بتغني ويقولك النوتة كانت فين بالظبط، وبيسمع ربع التون عشان تغنّي شرقي صح. تمارين متدرّجة من الأسهل للأصعب على قد مستواك، وكل يوم تقرير: عملت إيه، غلطت فين، ومحتاج تظبط إيه." data-en="A coach that listens while you sing and shows exactly where each note landed, and hears quarter tones so you sing Arabic music right. Exercises that build from easy to hard at your level, and a daily report: what you did, where you slipped, what to fix next."></p>
    <a class="cta" href="#wait" data-ar="انضم لقايمة الانتظار" data-en="Join the waitlist"></a>
    <div class="note" data-ar="أندرويد وآيفون · أول 2027" data-en="Android and iPhone · early 2027"></div>
  </div>
  <div class="stage">
    <small data-ar="بياتي على ري — صوتك فوق الخط الدهبي" data-en="Bayati on D — your voice over the gold line"></small>
    <canvas id="wave" aria-label="pitch line demo"></canvas>
    <div class="read"><span data-ar="الهدف" data-en="Target"></span><b id="tg">D3</b><span data-ar="الفرق" data-en="Off by"></span><b id="df">+4c</b></div>
  </div>
</div></header>

<section class="band"><div class="in">
  <h2 data-ar="انت مين؟" data-en="Who are you?"></h2>
  <p class="sub" data-ar="أول ما تفتح التطبيق بتختار بابك، وكل حاجة جواه متظبطة عليك." data-en="Pick your door when you open the app, and everything inside is set up for you."></p>
  <div class="doors">
    <div class="door"><b data-ar="بغنّي" data-en="I sing"></b><p data-ar="مطرب أو منشد أو هاوي. بآلات أو من غير آلات. تسخين، تمارين، وخطة يومية بمراحل." data-en="Singer, munshid or hobbyist, with or without instruments. Warm-up, exercises and a daily plan in stages."></p></div>
    <div class="door"><b data-ar="بلحّن" data-en="I compose"></b><p data-ar="ظبّط لحنك: دندنه، والبرنامج يقرّب كل نوتة لدرجة المقام بتاعتها، ويكتبهولك نوتات وتاخده MIDI. ربع التون بيفضل ربع تون." data-en="Polish your melody: hum it, and every note is snapped to its degree in the maqam, written out as notes and exported as MIDI. A quarter tone stays a quarter tone."></p></div>
    <div class="door"><b data-ar="بتعلّم مزيكا" data-en="I'm learning"></b><p data-ar="اتعلّم مزيكا شرقي من الصفر: يعني إيه بُعد ويعني إيه مسافة، والأجناس، والمقامات الـ 8 الأساسية، وقراية النوتة. خطوة خطوة بشرح بسيط، وتسمع كل مثال وتتمرّن عليه." data-en="Learn Arabic music from zero: what an interval is, the ajnas, the 8 main maqamat and reading notation. Step by step in plain language, with every example to hear and practise."></p></div>
  </div>
</div></section>

<section class="band"><div class="in">
  <h2 data-ar="اللي مش هتلاقيه في تطبيقات الغُنا التانية" data-en="What other singing apps don't do"></h2>
  <p class="sub" data-ar="التطبيقات الغربية بتحسب أي نوتة بين مفتاحين على البيانو غلط. هنا ده جزء من المزيكا." data-en="Western apps mark any note between two piano keys as wrong. Here it's part of the music."></p>
  <div class="feat">
    <div><span class="q" data-ar="ربع التون" data-en="Quarter tones"></span><b data-ar="هتسمع الشرقي وتغنّيه صح بسهولة" data-en="Hear Arabic music and sing it right, easily"></b><p data-ar="سيكاه، راست، بياتي، صبا: البرنامج عارف مكان كل درجة، وبيقيس ربع التون بدقة بدل ما يحسبه غلط." data-en="Sikah, Rast, Bayati, Saba: the app knows where every degree lives and measures quarter tones precisely instead of calling them wrong."></p>
      <div class="scale"><span>D</span><span class="qt">E½♭</span><span>F</span><span>G</span><span>A</span><span>B♭</span><span>C</span><span>D</span></div></div>
    <div><span class="q" data-ar="تمرين النهارده" data-en="Today's session"></span><b data-ar="خطة بمراحل على قد مستواك" data-en="A staged plan at your level"></b><p data-ar="مبتدئ، متوسط، أو محترف. التمارين بتتدرّج من الأسهل للأصعب، ولو ما عدّيتش الهدف التمرين بيبقى أبسط لحد ما تعدّيه بنجاح." data-en="Beginner, intermediate or pro. Exercises build from easy to hard, and if you miss the goal the exercise gets simpler until you pass it."></p></div>
    <div><span class="q" data-ar="التقرير" data-en="The report"></span><b data-ar="شوف مستواك بيتطوّر يوم بيوم" data-en="Watch your level grow day by day"></b><p data-ar="كل يوم تقرير: عملت إيه، غلطت فين، ومحتاج تظبط إيه. وتشوف تقدّمك من أسبوع للتاني: النوتات بقت أظبط، والدخلة أنضف، والنَفَس أطول." data-en="Every day a report: what you did, where you slipped, what to fix. And your progress week to week: notes more in tune, cleaner entries, longer breath."></p></div>
    <div class="star"><span class="badge" data-ar="جديد" data-en="New"></span><span class="q" data-ar="صوتك النهارده" data-en="Your voice today"></span><b data-ar="30 ثانية تعرف بيهم صوتك مرتاح ولا تعبان" data-en="30 seconds to know if your voice is rested or tired"></b><p data-ar="قبل ما تغنّي وبعدها، البرنامج بيسمع ثبات صوتك ونضافته ونَفَسك، ويقارنك بنفسك مش بأرقام عامة. تعرف إمتى تشد وإمتى تريّح صوتك قبل ما يتعب." data-en="Before and after you sing, the app listens to your voice's stability, clarity and breath, and compares you with yourself rather than with averages. Know when to push and when to rest before your voice gets tired."></p><div class="meters"><span><i style="width:82%"></i><em data-ar="ثبات الصوت" data-en="Stability"></em></span><span><i style="width:68%"></i><em data-ar="نضافة الصوت" data-en="Clarity"></em></span><span><i style="width:74%"></i><em data-ar="النَفَس" data-en="Breath"></em></span></div><small class="med" data-ar="مؤشر للمتابعة، مش تشخيص طبي." data-en="A tracking indicator, not a medical diagnosis."></small></div>
    <div><span class="q" data-ar="النوتة" data-en="Notation"></span><b data-ar="اقرا النوتة وغنّيها" data-en="Read music and sing it"></b><p data-ar="المدرج وعلامات ربع التون، الأزمنة والموازين، وصولفيج بالمايك: كل نوتة بتتقاس لوحدها." data-en="The staff and quarter-tone signs, note values and meters, and solfège with the mic: every note measured on its own."></p></div>
    <div><span class="q" data-ar="الإيقاع" data-en="Rhythm"></span><b data-ar="غنّي مع إيقاع حقيقي" data-en="Sing with real rhythms"></b><p data-ar="مقسوم، بلدي، صعيدي، إيقاعات خليجي، وسماعي ثقيل 10/8. قول «تا» على الضربة، ادخل صح، وغنّي جمل كاملة على الإيقاع." data-en="Maqsoum, Baladi, Saidi, Gulf rhythms and Samai Thaqil 10/8. Say “ta” on the beat, come in on time, and sing full phrases over the groove."></p></div>
  </div>
</div></section>

<section class="band" id="wait"><div class="in">
  <h2 data-ar="اعرف أول ما ينزل" data-en="Hear when it launches"></h2>
  <p class="sub" data-ar="سيب إيميلك ونبعتلك أول ما التطبيق ينزل." data-en="Leave your email and we'll tell you the day the app is out."></p>
  <form id="f"><input id="em" type="email" required placeholder="you@email.com" aria-label="Email"><button class="cta" type="submit" data-ar="ابعتلي" data-en="Notify me"></button></form>
  <div id="ok" role="status"></div>
</div></section>

<footer class="band"><div class="in" style="display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:space-between"><span>© 2026 Vocalna · vocalna.com</span><span style="display:flex;gap:18px"><a id="ig" href="#" hidden>Instagram</a><a id="tt" href="#" hidden>TikTok</a><a id="fb" href="#" hidden>Facebook</a><a href="#privacy" data-ar="الخصوصية" data-en="Privacy" onclick="document.getElementById('privacy').hidden=false"></a></span></div></footer>
<section class="band" id="privacy" hidden><div class="in" style="max-width:760px;padding-bottom:40px">
  <h2 data-ar="سياسة الخصوصية" data-en="Privacy policy"></h2>
  <div class="sub" style="max-width:none" data-ar="<p><b>المايك:</b> ڤوكالنا بيسمع صوتك وانت بتتمرّن عشان يقيس الطبقة والتوقيت. التحليل بيحصل على جهازك، والصوت مش بيتبعت لينا ولا لأي حد، إلا لو انت اخترت تحفظ تسجيل.</p><p><b>اللي بنحفظه:</b> إيميلك واسمك لو عملت حساب، وتقدّمك ونتايج تمارينك عشان تكمّل من أي جهاز.</p><p><b>الدفع:</b> بيتم عن طريق جوجل بلاي وآب ستور. احنا مش بنشوف بيانات الكارت.</p><p><b>قايمة الانتظار:</b> الإيميل بيتستخدم بس عشان نبلّغك بنزول التطبيق.</p><p><b>مسح بياناتك:</b> من جوه التطبيق أو بإيميل لـ hello@vocalna.com، وبنمسح كل حاجة.</p><p>مش بنبيع بياناتك ولا بنشاركها لإعلانات.</p>" data-en="<p><b>Microphone:</b> Vocalna listens while you practise to measure pitch and timing. Analysis happens on your device; your voice is not sent to us or anyone else unless you choose to save a recording.</p><p><b>What we store:</b> your email and name if you create an account, and your progress and exercise results so you can continue on any device.</p><p><b>Payments:</b> handled by Google Play and the App Store. We never see your card details.</p><p><b>Waitlist:</b> your email is used only to tell you when the app launches.</p><p><b>Deleting your data:</b> from inside the app or by emailing hello@vocalna.com, and we delete everything.</p><p>We do not sell your data or share it for advertising.</p>"></div>
</div></section>

<script>
// لينكات السوشيال وقايمة الانتظار: بتتحط هنا لما تجهز
const LINKS={ig:'https://www.instagram.com/vocalna.app/',tt:'https://www.tiktok.com/@vocalna.app',fb:''};
const WAITLIST='https://tally.so/r/laex7B';   // لينك فورم Tally
let L='ar';try{L=localStorage.getItem('vl_lang')||'ar'}catch(e){}
const $=id=>document.getElementById(id);
Object.entries(LINKS).forEach(([k,v])=>{if(v){$(k).href=v;$(k).hidden=false;}});
function apply(){
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-ar]').forEach(e=>e.innerHTML=e.dataset[L]);
  $('wm').innerHTML=L==='ar'?'ڤوكال<i>نا</i>':'Vocal<i>na</i>';
  $('lang').textContent=L==='ar'?'English':'عربي';
  $('em').placeholder=L==='ar'?'إيميلك':'you@email.com';
}
$('lang').onclick=()=>{L=L==='ar'?'en':'ar';try{localStorage.setItem('vl_lang',L)}catch(e){}apply()};
$('f').addEventListener('submit',e=>{e.preventDefault();
  if(WAITLIST){window.open(WAITLIST+'?email='+encodeURIComponent($('em').value),'_blank');$('ok').textContent=L==='ar'?'شكرًا! كمّل في الصفحة اللي فتحت.':'Thanks! Finish in the page that opened.';}
  else $('ok').textContent=L==='ar'?'القايمة هتفتح خلال أيام، ارجعلنا قريب.':'The list opens in a few days, check back soon.';});
apply();
if(location.hash==='#privacy')$('privacy').hidden=false;
const cv=$('wave'),cx=cv.getContext('2d'),deg=[0,1.5,3,5,7,5,3,1.5,0],nm=['D3','E½♭3','F3','G3','A3','G3','F3','E½♭3','D3'];
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
let t0=performance.now();
function draw(now){
  const w=cv.clientWidth,h=cv.clientHeight,dpr=devicePixelRatio||1;
  if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr}
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,w,h);
  const y=d=>h-18-(d/7)*(h-40),seg=w/deg.length,t=((now-t0)/1000)%(deg.length*0.9),cur=Math.min(deg.length-1,Math.floor(t/0.9));
  cx.strokeStyle=css('--line');cx.lineWidth=1;
  for(let k=0;k<=7;k++){cx.beginPath();cx.moveTo(0,y(k));cx.lineTo(w,y(k));cx.stroke()}
  cx.lineWidth=6;cx.lineCap='round';cx.strokeStyle=css('--gold');cx.globalAlpha=.55;
  deg.forEach((d,i)=>{cx.beginPath();cx.moveTo(i*seg+6,y(d));cx.lineTo((i+1)*seg-6,y(d));cx.stroke()});
  cx.globalAlpha=1;cx.lineWidth=2.5;cx.strokeStyle='#4fd18b';cx.beginPath();
  const end=t/0.9*seg;
  for(let x=0;x<=end;x+=3){const i=Math.min(deg.length-1,Math.floor(x/seg)),u=(x-i*seg)/seg,prev=i?deg[i-1]:deg[0],base=u<.12?prev+(deg[i]-prev)*(u/.12):deg[i];
    const v=base+0.05*Math.sin(x/5)+(i===3?0.08:0);x?cx.lineTo(x,y(v)):cx.moveTo(x,y(v))}
  cx.stroke();
  $('tg').textContent=nm[cur];$('df').textContent=(cur===3?'+9':'+3')+'c';
  requestAnimationFrame(draw);
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(draw);
</script>
</body>
</html>
